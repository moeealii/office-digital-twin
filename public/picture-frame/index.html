<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'none'; connect-src 'none'; font-src data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; media-src 'none'; manifest-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>Home HQ · Public read-only Today</title>
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./sky.css">
  <link rel="stylesheet" href="./home.css">
  <link rel="stylesheet" href="./cameras.css">
  <link rel="stylesheet" href="./shopping.css">
  <link rel="stylesheet" href="./photos.css">
  <link rel="stylesheet" href="./public.css">
  <script defer src="./public-entry.js"></script>
  <script defer src="./icons.js"></script>
  <script defer src="./app.js"></script>
  <script defer src="./public-theme.js"></script>
  <script defer src="./sky.js"></script>
  <script defer src="./demo-adapters.js"></script>
  <script defer src="./home.js"></script>
  <script defer src="./shopping.js"></script>
  <script defer src="./photos.js"></script>
</head>
<body>
  <div class="stage public-preview" id="stage" data-mode="day">
    <div class="rail" id="rail" aria-hidden="true">
      <div class="rail-item is-active"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span></div>
      <div class="rail-item"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg><span>Cameras</span></div>
      <div class="rail-item"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.8L21 8H6.5"/><circle cx="10" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span>Shopping</span></div>
      <div class="rail-item"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span>Photos</span></div>
      <div class="rail-clock" id="railClock"></div>
    </div>
    <main class="views" aria-label="Home HQ Today · public read-only preview">
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-cameras" data-view="cameras"></section>
      <section class="view" id="view-shopping" data-view="shopping"></section>
      <section class="view view--bleed" id="view-photos" data-view="photos"></section>
    </main>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="sheet-layer" id="sheetLayer"></div>
    <p class="public-clock-source">Browser-local clock · decorative local-time sky, not weather · cameras, photos and lists private</p>
    <p class="public-label">Public preview · read-only</p>
    <noscript><p class="public-no-script">JavaScript is required to run the Home HQ homepage.</p></noscript>
  </div>
</body>
</html>
